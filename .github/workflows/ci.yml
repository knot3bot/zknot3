name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zig-version: ["0.17.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}
          cache: true

      - name: Check formatting
        run: zig fmt --check .

      - name: Run unit tests
        run: zig build test-unit -Doptimize=Debug

      - name: Run integration tests
        run: zig build test-integration -Doptimize=Debug

  build-release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version:  0.17.0
          cache: true

      - name: Build release
        run: zig build -Doptimize=ReleaseSafe

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          docker build -t zknot3:${VERSION} -t zknot3:latest -f deploy/docker/Dockerfile .
