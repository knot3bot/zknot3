name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Zig 0.17.0 stable does not exist yet; the codebase tracks the 0.17.0-dev
  # nightly line. Pinned to an exact build so CI is reproducible.
  ZIG_VERSION: "0.17.0-dev.2307+392b17125"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig (pinned nightly)
        run: |
          curl -sL "https://ziglang.org/builds/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Check formatting
        run: zig fmt --check src tools test

      - name: Compile everything
        run: zig build

      - name: Run unit tests
        run: zig build test-unit -Doptimize=Debug

      - name: Run integration tests
        run: zig build test-integration -Doptimize=Debug

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig (pinned nightly)
        run: |
          curl -sL "https://ziglang.org/builds/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Executable proofs (exhaustive)
        run: zig build test-formal
      - name: Coq specification
        run: |
          sudo apt-get update && sudo apt-get install -y coq
          bash tools/formal/coq_gate.sh
      - name: Lean 4 specification
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain stable
          export PATH="$HOME/.elan/bin:$PATH"
          bash tools/formal/lean_gate.sh

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test

  build-release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig (pinned nightly)
        run: |
          curl -sL "https://ziglang.org/builds/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Build release
        run: zig build -Doptimize=ReleaseSafe

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          docker build -t zknot3:${VERSION} -t zknot3:latest -f deploy/docker/Dockerfile .
